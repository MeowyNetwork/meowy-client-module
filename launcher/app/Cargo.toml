[package]
name = "meowy-launcher"
description = "Meowy Launcher: starts Garry's Mod through Steam, repairs the Meowy Client Pack, offers Rejoin after a crash"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "MeowyLauncher"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
meowy-launcher-core = { path = "../core" }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
# Plain `cargo build` embeds the pages (no tauri-cli or dev server needed).
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
