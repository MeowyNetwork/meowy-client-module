name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    # A pull request that only changes prose builds nothing. Pushes to main and
    # tags always run.
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"

# Read-only for every build and test job, pull requests included. Only the
# release job (tags) may write. Actions are pinned by commit, not by tag.
permissions:
  contents: read

# A new push to a pull request stops the run of the push before it. Runs on
# main and on tags are never cancelled.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# How the jobs fit together (wall time is the slowest of the first four, then package):
#   lua          the menu Lua's and the pages' tests         (Linux, seconds)
#   launcher     cargo test, MeowyLauncher.exe               (Windows)
#   build win64  the 64-bit DLLs and every test, run         (Windows, at the same time)
#   build win32  the 32-bit DLLs and every test, run         (Windows, at the same time)
#   package      installer, zip, checksums; needs launcher and both builds
#   release      tags only; needs package and lua
jobs:
  lua:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Lua 5.1 (Garry's Mod runs LuaJIT, 5.1 syntax)
        run: sudo apt-get update && sudo apt-get install -y lua5.1

      # Every tests/*_test.lua and tests/*_test.js: a new test file is run
      # without being listed here.
      - name: Check and test the menu Lua and the pages
        run: |
          luac5.1 -p src/lua/*.lua tests/*.lua
          for t in tests/*_test.lua; do echo "== $t"; lua5.1 "$t"; done
          for t in tests/*_test.js; do echo "== $t"; node "$t"; done

  launcher:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: launcher
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal --no-self-update && rustup default stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: launcher

      - name: Launcher rules (cargo test, core)
        run: cargo test -p meowy-launcher-core --locked

      - name: Policy key files (policy_key_test.ps1)
        working-directory: .
        shell: pwsh
        run: pwsh -NoProfile -File tests/policy_key_test.ps1

      - name: Build MeowyLauncher.exe
        run: cargo build -p meowy-launcher --release --locked

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: meowy-launcher
          path: launcher/target/release/MeowyLauncher.exe

  # One build tree per architecture gives the DLLs and every test program
  # (CMakeLists.txt's meowy_smoke list), built in one parallel pass; then
  # tests/run_smokes.ps1 runs them all and fails if any failed.
  # Not run: ipc_smoke (needs the Discord app), audio_watch_smoke (sound
  # devices), doctor_smoke (a GPU) and notify_manual. They are built, so they
  # can't rot; run them on a PC before a release.
  build:
    name: build (${{ matrix.suffix }})
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            suffix: win64
          - arch: Win32
            suffix: win32
    defaults:
      run:
        shell: pwsh -NoProfile -Command "$PSNativeCommandUseErrorActionPreference = $true; $ErrorActionPreference = 'Stop'; . '{0}'"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Configure
        run: cmake -S . -B build -A ${{ matrix.arch }} -DMEOWY_BUILD_TESTS=ON

      - name: Build the DLLs and the tests
        run: cmake --build build --config Release --parallel

      - name: Run the tests
        run: pwsh -NoProfile -File tests/run_smokes.ps1 -Build build

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dll-${{ matrix.suffix }}
          path: |
            build/Release/gmcl_meowy_${{ matrix.suffix }}.dll
            build/Release/gmsv_meowy_boot_${{ matrix.suffix }}.dll
          if-no-files-found: error

  package:
    runs-on: windows-latest
    timeout-minutes: 15
    needs: [launcher, build]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: meowy-launcher
          path: launcher-bin

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: dll-*
          path: bin
          merge-multiple: true

      - name: Installer rules (uninstall_smoke)
        shell: pwsh
        run: |
          & "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe" /nologo /main:UninstallSmoke /out:uninstall_smoke.exe /r:System.Windows.Forms.dll /r:System.Drawing.dll installer\Installer.cs tests\uninstall_smoke.cs
          if ($LASTEXITCODE -ne 0) { throw "csc failed" }
          $scratch = Join-Path $env:RUNNER_TEMP "uninstall_smoke"
          New-Item -ItemType Directory $scratch | Out-Null
          ./uninstall_smoke.exe $scratch
          if ($LASTEXITCODE -ne 0) { throw "uninstall_smoke failed" }

      - name: Build installer
        shell: pwsh
        run: ./installer/build.ps1 -Win32 bin/gmcl_meowy_win32.dll -Win64 bin/gmcl_meowy_win64.dll -Boot32 bin/gmsv_meowy_boot_win32.dll -Boot64 bin/gmsv_meowy_boot_win64.dll -Launcher launcher-bin/MeowyLauncher.exe -Out MeowyClientPack.exe

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item bin/gmcl_meowy_win32.dll, bin/gmcl_meowy_win64.dll, bin/gmsv_meowy_boot_win32.dll, bin/gmsv_meowy_boot_win64.dll, launcher-bin/MeowyLauncher.exe, MeowyClientPack.exe dist/
          Compress-Archive -Path dist/gmcl_meowy_win32.dll, dist/gmcl_meowy_win64.dll, dist/gmsv_meowy_boot_win32.dll, dist/gmsv_meowy_boot_win64.dll -DestinationPath dist/meowy-client-module-manual.zip
          Get-ChildItem dist -File | ForEach-Object { "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name } | Set-Content dist/SHA256SUMS.txt
          Get-Content dist/SHA256SUMS.txt

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: meowy-client-module
          path: dist/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [package, lua]
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: write       # create the release
      id-token: write       # build provenance attestations
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: meowy-client-module
          path: dist

      - name: The files are the ones the build hashed
        shell: pwsh
        run: |
          foreach ($line in Get-Content dist/SHA256SUMS.txt) {
            $hash, $name = $line -split '  ', 2
            if ((Get-FileHash (Join-Path dist $name) -Algorithm SHA256).Hash.ToLower() -ne $hash) { throw "$name doesn't match SHA256SUMS.txt" }
          }

      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: |
            dist/gmcl_meowy_win32.dll
            dist/gmcl_meowy_win64.dll
            dist/gmsv_meowy_boot_win32.dll
            dist/gmsv_meowy_boot_win64.dll
            dist/MeowyLauncher.exe
            dist/MeowyClientPack.exe

      - name: Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/MeowyClientPack.exe dist/meowy-client-module-manual.zip dist/SHA256SUMS.txt --title "${{ github.ref_name }}" --notes-file RELEASE_NOTES.md
