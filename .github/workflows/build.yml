name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write       # create releases on tags
  id-token: write       # build provenance attestations
  attestations: write

jobs:
  lua:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Lua 5.1 (Garry's Mod runs LuaJIT, 5.1 syntax)
        run: sudo apt-get update && sudo apt-get install -y lua5.1

      - name: Check and test the menu Lua
        run: |
          luac5.1 -p src/lua/*.lua tests/*.lua
          lua5.1 tests/resilience_logic_test.lua
          lua5.1 tests/resilience_menu_test.lua
          lua5.1 tests/doctor_logic_test.lua
          lua5.1 tests/home_logic_test.lua
          lua5.1 tests/console_logic_test.lua
          lua5.1 tests/settings_guard_logic_test.lua
          lua5.1 tests/content_logic_test.lua
          lua5.1 tests/browse_logic_test.lua
          node tests/home_page_test.js
          node tests/launcher_card_test.js

  launcher:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: launcher
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal --no-self-update && rustup default stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: launcher

      - name: Launcher rules (cargo test, core)
        run: cargo test -p meowy-launcher-core --locked

      - name: Build MeowyLauncher.exe
        run: cargo build -p meowy-launcher --release --locked

      - uses: actions/upload-artifact@v4
        with:
          name: meowy-launcher
          path: launcher/target/release/MeowyLauncher.exe

  windows:
    runs-on: windows-latest
    needs: launcher
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: meowy-launcher
          path: launcher-bin

      - name: Build gmcl_meowy_win32.dll
        run: |
          cmake -S . -B build32 -A Win32
          cmake --build build32 --config Release

      - name: Build gmcl_meowy_win64.dll
        run: |
          cmake -S . -B build64 -A x64
          cmake --build build64 --config Release

      - name: Start-up line rules (startup_hook_smoke)
        run: |
          cmake -S . -B buildtest -A x64 -DMEOWY_BUILD_TESTS=ON
          cmake --build buildtest --config Release --target startup_hook_smoke
          ./buildtest/Release/startup_hook_smoke.exe

      - name: Signed notification catalogue (notify_catalogue_smoke, both bitnesses)
        run: |
          cmake --build buildtest --config Release --target notify_catalogue_smoke
          ./buildtest/Release/notify_catalogue_smoke.exe
          cmake -S . -B buildtest32 -A Win32 -DMEOWY_BUILD_TESTS=ON
          cmake --build buildtest32 --config Release --target notify_catalogue_smoke
          ./buildtest32/Release/notify_catalogue_smoke.exe

      - name: Signed policy (policy_smoke, both bitnesses)
        run: |
          cmake --build buildtest --config Release --target policy_smoke
          ./buildtest/Release/policy_smoke.exe "$env:RUNNER_TEMP"
          cmake --build buildtest32 --config Release --target policy_smoke
          ./buildtest32/Release/policy_smoke.exe "$env:RUNNER_TEMP"
      - name: Signed updater (updater_smoke, both bitnesses)
        run: |
          cmake --build buildtest --config Release --target updater_smoke
          ./buildtest/Release/updater_smoke.exe "$env:RUNNER_TEMP"
          cmake --build buildtest32 --config Release --target updater_smoke
          ./buildtest32/Release/updater_smoke.exe "$env:RUNNER_TEMP"
      - name: Fast Lua lookup rules (lua_lookup_smoke, both bitnesses)
        run: |
          cmake --build buildtest --config Release --target lua_lookup_smoke
          ./buildtest/Release/lua_lookup_smoke.exe
          cmake -S . -B buildtest32 -A Win32 -DMEOWY_BUILD_TESTS=ON
          cmake --build buildtest32 --config Release --target lua_lookup_smoke
          ./buildtest32/Release/lua_lookup_smoke.exe

      - name: Join pre-warm (prewarm_smoke, both bitnesses)
        run: |
          cmake --build buildtest --config Release --target prewarm_smoke
          ./buildtest/Release/prewarm_smoke.exe "$env:RUNNER_TEMP"
          cmake --build buildtest32 --config Release --target prewarm_smoke
          ./buildtest32/Release/prewarm_smoke.exe "$env:RUNNER_TEMP"
      - name: Mouse confine rules (mouse_confine_smoke, both bitnesses)
        run: |
          cmake --build buildtest --config Release --target mouse_confine_smoke
          ./buildtest/Release/mouse_confine_smoke.exe
          cmake --build buildtest32 --config Release --target mouse_confine_smoke
          ./buildtest32/Release/mouse_confine_smoke.exe
      - name: LZMA pak cache (pak_cache_smoke, both bitnesses)
        run: |
          cmake --build buildtest --config Release --target pak_cache_smoke
          ./buildtest/Release/pak_cache_smoke.exe
          cmake --build buildtest32 --config Release --target pak_cache_smoke
          ./buildtest32/Release/pak_cache_smoke.exe
      - name: Settings backups (config_backup_smoke, both bitnesses)
        run: |
          cmake --build buildtest --config Release --target config_backup_smoke
          ./buildtest/Release/config_backup_smoke.exe "$env:RUNNER_TEMP"
          cmake --build buildtest32 --config Release --target config_backup_smoke
          ./buildtest32/Release/config_backup_smoke.exe "$env:RUNNER_TEMP"
      - name: Fast file.Find rules (lua_find_smoke, both bitnesses)
        run: |
          cmake --build buildtest --config Release --target lua_find_smoke
          ./buildtest/Release/lua_find_smoke.exe
          cmake --build buildtest32 --config Release --target lua_find_smoke
          ./buildtest32/Release/lua_find_smoke.exe
      - name: Console capture (console_capture_smoke, both bitnesses)
        run: |
          cmake --build buildtest --config Release --target console_capture_smoke
          ./buildtest/Release/console_capture_smoke.exe
          cmake --build buildtest32 --config Release --target console_capture_smoke
          ./buildtest32/Release/console_capture_smoke.exe
      - name: Server lists from Steam (server_query_smoke, both bitnesses)
        run: |
          cmake --build buildtest --config Release --target server_query_smoke
          ./buildtest/Release/server_query_smoke.exe
          cmake --build buildtest32 --config Release --target server_query_smoke
          ./buildtest32/Release/server_query_smoke.exe

      - name: Content platform adverts (content_advert_smoke, both bitnesses)
        run: |
          cmake --build buildtest --config Release --target content_advert_smoke
          ./buildtest/Release/content_advert_smoke.exe
          cmake --build buildtest32 --config Release --target content_advert_smoke
          ./buildtest32/Release/content_advert_smoke.exe

      - name: Launcher pipe, the pack's end (launcher_pipe_smoke, both bitnesses)
        run: |
          cmake --build buildtest --config Release --target launcher_pipe_smoke
          ./buildtest/Release/launcher_pipe_smoke.exe
          cmake --build buildtest32 --config Release --target launcher_pipe_smoke
          ./buildtest32/Release/launcher_pipe_smoke.exe

      - name: Font pass gdi32 loads (font_loads_smoke, both bitnesses)
        run: |
          cmake --build buildtest --config Release --target font_loads_smoke
          ./buildtest/Release/font_loads_smoke.exe "$env:RUNNER_TEMP"
          cmake --build buildtest32 --config Release --target font_loads_smoke
          ./buildtest32/Release/font_loads_smoke.exe "$env:RUNNER_TEMP"

      - name: Missing-file cache rules (fs_cache_smoke, both bitnesses)
        run: |
          cmake --build buildtest --config Release --target fs_cache_smoke
          ./buildtest/Release/fs_cache_smoke.exe "$env:RUNNER_TEMP"
          cmake --build buildtest32 --config Release --target fs_cache_smoke
          ./buildtest32/Release/fs_cache_smoke.exe "$env:RUNNER_TEMP"

      - name: Rejoin-after-crash session file (session_smoke)
        run: |
          cmake --build buildtest --config Release --target session_smoke
          ./buildtest/Release/session_smoke.exe "$env:RUNNER_TEMP"

      - name: Installer rules (uninstall_smoke)
        shell: pwsh
        run: |
          & "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe" /nologo /main:UninstallSmoke /out:uninstall_smoke.exe /r:System.Windows.Forms.dll /r:System.Drawing.dll installer\Installer.cs tests\uninstall_smoke.cs
          if ($LASTEXITCODE -ne 0) { throw "csc failed" }
          $scratch = Join-Path $env:RUNNER_TEMP "uninstall_smoke"
          New-Item -ItemType Directory $scratch | Out-Null
          ./uninstall_smoke.exe $scratch
          if ($LASTEXITCODE -ne 0) { throw "uninstall_smoke failed" }

      - name: Build installer
        shell: pwsh
        run: ./installer/build.ps1 -Win32 build32/Release/gmcl_meowy_win32.dll -Win64 build64/Release/gmcl_meowy_win64.dll -Boot32 build32/Release/gmsv_meowy_boot_win32.dll -Boot64 build64/Release/gmsv_meowy_boot_win64.dll -Launcher launcher-bin/MeowyLauncher.exe -Out MeowyClientPack.exe

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item build32/Release/gmcl_meowy_win32.dll, build64/Release/gmcl_meowy_win64.dll, build32/Release/gmsv_meowy_boot_win32.dll, build64/Release/gmsv_meowy_boot_win64.dll, launcher-bin/MeowyLauncher.exe, MeowyClientPack.exe dist/
          Compress-Archive -Path dist/gmcl_meowy_win32.dll, dist/gmcl_meowy_win64.dll, dist/gmsv_meowy_boot_win32.dll, dist/gmsv_meowy_boot_win64.dll -DestinationPath dist/meowy-client-module-manual.zip
          Get-ChildItem dist -File | ForEach-Object { "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name } | Set-Content dist/SHA256SUMS.txt
          Get-Content dist/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: meowy-client-module
          path: dist/*

      - name: Attest build provenance
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/gmcl_meowy_win32.dll
            dist/gmcl_meowy_win64.dll
            dist/gmsv_meowy_boot_win32.dll
            dist/gmsv_meowy_boot_win64.dll
            dist/MeowyLauncher.exe
            dist/MeowyClientPack.exe

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/MeowyClientPack.exe dist/meowy-client-module-manual.zip dist/SHA256SUMS.txt --title "${{ github.ref_name }}" --notes-file RELEASE_NOTES.md
